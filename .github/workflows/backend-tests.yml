# The scanner's tests, under both runners the project uses. They need no
# secret and never reach the network (backend/tests/offline.py).
name: Backend tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: python -m pip install -r requirements.txt pytest
      - name: pytest
        run: python -m pytest -q
      - name: unittest
        run: python -m unittest discover -s tests
